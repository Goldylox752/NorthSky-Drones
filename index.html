<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8fb;--card:#fff;--text:#0b1220;--muted:#5b6678;--line:#dbe2ec;--accent:#0284c7;--accent-ink:#fff;--glow:rgba(2,132,199,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f19;--card:#111827;--text:#f1f5f9;--muted:#94a3b8;--line:#1f2a3d;--accent:#0ea5e9;--accent-ink:#04121d;--glow:rgba(14,165,233,.16)}}
:root[data-theme="dark"]{--bg:#0b0f19;--card:#111827;--text:#f1f5f9;--muted:#94a3b8;--line:#1f2a3d;--accent:#0ea5e9;--accent-ink:#04121d;--glow:rgba(14,165,233,.16)}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.55}
a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.banner{background:var(--accent);color:var(--accent-ink);text-align:center;font-size:13px;font-weight:600;padding:8px 12px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-weight:900;letter-spacing:.06em}.logo b{color:var(--accent)}
nav{display:flex;gap:24px;font-size:14px;color:var(--muted);font-weight:600}
nav a:hover{color:var(--accent)}
@media(max-width:720px){nav{display:none}}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:13px 22px;font:700 15px Inter,sans-serif;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn:active{transform:scale(.97)}
.cartbtn{position:relative}
.badge{background:var(--accent-ink);color:var(--accent);border-radius:99px;padding:0 7px;font-size:12px}
.hero{padding:56px 0 40px;background:radial-gradient(600px 300px at 70% 0,var(--glow),transparent)}
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:32px;align-items:center}
@media(max-width:820px){.hero .wrap{grid-template-columns:1fr;text-align:center}.hero .cta,.chips{justify-content:center}}
.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
h1{font-size:clamp(38px,6vw,64px);line-height:1.05;font-weight:900;margin:10px 0 16px;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.lead{color:var(--muted);font-size:18px;max-width:520px}
@media(max-width:820px){.lead{margin:0 auto}}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin:26px 0 18px}
.chips{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.chips span{border:1px solid var(--line);border-radius:99px;padding:4px 12px}
.drone{animation:float 5s ease-in-out infinite;width:100%;height:auto}
@keyframes float{50%{transform:translateY(-10px)}}
@media(prefers-reduced-motion:reduce){.drone{animation:none}}
section{padding:64px 0}
h2{font-size:clamp(28px,4vw,40px);font-weight:900;margin:6px 0 10px;letter-spacing:-.01em}
.sub{color:var(--muted);max-width:620px}
.grid{display:grid;gap:16px;margin-top:32px}
.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:820px){.g3,.g2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px}
.card h3{margin:10px 0 6px;font-size:18px}.card p{margin:0;color:var(--muted);font-size:15px}
.ico{font-size:26px}
.pkg{cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;border-width:2px;transition:.15s}
.pkg.sel{border-color:var(--accent);box-shadow:0 10px 40px var(--glow)}
.price{font-size:48px;font-weight:900;margin:14px 0 4px}.price small{font-size:14px;color:var(--muted);font-weight:600}
.pkg ul{list-style:none;padding:0;margin:14px 0 20px;font-size:15px}
.pkg li{padding:6px 0;border-bottom:1px solid var(--line)}.pkg li::before{content:"✓ ";color:var(--accent);font-weight:800}
